name: _test

on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm intentionally excluded: bcrypto's torsion C deps
        # (transitive via navcoin-js) fail to compile on Windows ARM64
        # (immintrin.h C1189 in mpi.c). Re-add once upstream supports it.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --ignore-platform

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test
