name: _test

on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # windows-11-arm intentionally excluded: bcrypto's torsion C deps
        # (transitive via navcoin-js) fail to compile on Windows ARM64
        # (immintrin.h C1189 in mpi.c). Re-add once upstream supports it.
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Cache node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: test-nm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      # node-pre-gyp (sqlite3) runs the node-gyp that npm bundles rather
      # than the one in devDependencies, and that copy only detects Visual
      # Studio up to 2022 — windows-latest now ships VS2026. Point npm at a
      # node-gyp that knows about it.
      - name: Use a node-gyp that finds VS2026 (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g node-gyp@12
          echo "npm_config_node_gyp=$(npm root -g)/node-gyp/bin/node-gyp.js" >> "$GITHUB_ENV"

      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm install --ignore-platform

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

  # How the GUI finds and starts the daemon is platform-specific (batch
  # shims, .exe suffixes, the bundled runtime's location) and a mistake
  # there only shows up in a released archive, so it gets its own tests on
  # every platform we ship. ntr-daemon-launch has no GUI dependencies, so
  # this needs no webview toolkit.
  daemon-launch:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy -p ntr-daemon-launch --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test -p ntr-daemon-launch
