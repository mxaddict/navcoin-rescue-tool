name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.0.1). Tag must already exist.'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_RUNTIME_VERSION: '22.11.0'

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            node_url: https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-x64.tar.xz
            ext: tar.gz
            prebuild_dir: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            node_url: https://nodejs.org/dist/v22.11.0/node-v22.11.0-linux-arm64.tar.xz
            ext: tar.gz
            prebuild_dir: linux-arm64
          # macOS Intel (x86_64) build skipped: Intel Macs are end-of-life,
          # GitHub is winding down macos-13 runners, and our user base is
          # Apple Silicon. Re-add if demand emerges.
          - os: macos-latest
            platform: macos
            arch: arm64
            node_url: https://nodejs.org/dist/v22.11.0/node-v22.11.0-darwin-arm64.tar.gz
            ext: tar.gz
            prebuild_dir: darwin-arm64
          - os: windows-latest
            platform: windows
            arch: x86_64
            node_url: https://nodejs.org/dist/v22.11.0/node-v22.11.0-win-x64.zip
            ext: zip
            prebuild_dir: win32-x64
          # windows arm64 build skipped: bcrypto torsion deps fail to compile
          # on Windows ARM64 (immintrin.h C1189). Re-add when upstream fixes.
    runs-on: ${{ matrix.os }}

    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            ref="${GITHUB_REF#refs/tags/}"
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
            echo "version=$ref" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Linux GUI build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache root node_modules
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: build-nm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install root dependencies (with dev for build tools)
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Cache GUI node_modules
        id: gui-nm-cache
        uses: actions/cache@v4
        with:
          path: gui/node_modules
          key: gui-nm-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('gui/package-lock.json') }}

      - name: Install GUI frontend dependencies
        if: steps.gui-nm-cache.outputs.cache-hit != 'true'
        run: npm --prefix gui install

      - name: Cache Tauri Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build GUI bundle
        run: npm run gui:build

      - name: Prune to production dependencies
        run: npm prune --omit=dev

      - name: Slim node_modules (drop docs, tests, source maps)
        shell: bash
        run: |
          set -euo pipefail
          cd node_modules

          # Directories that exist purely for development / docs / CI.
          find . -type d \( \
            -name 'test' -o -name 'tests' -o -name '__tests__' \
            -o -name 'docs' -o -name 'doc' \
            -o -name 'example' -o -name 'examples' -o -name 'samples' \
            -o -name 'coverage' -o -name '.nyc_output' \
            -o -name 'benchmark' -o -name 'benchmarks' \
            -o -name '.github' -o -name '.cache' -o -name '.idea' -o -name '.vscode' \
          \) -prune -exec rm -rf {} + 2>/dev/null || true

          # Files that are not needed at runtime. LICENSE files preserved
          # for redistribution compliance.
          find . -type f \( \
            -name '*.md' -o -name '*.markdown' \
            -o -name '*.ts' -o -name '*.tsx' -o -name '*.flow' \
            -o -name '*.map' -o -name '*.tsbuildinfo' -o -name '*.d.ts' \
            -o -name 'CHANGELOG*' -o -name 'AUTHORS*' \
            -o -name 'HISTORY*' -o -name 'README*' \
            -o -name '.eslintrc*' -o -name '.prettierrc*' -o -name '.editorconfig' \
            -o -name '.npmignore' -o -name '.gitignore' -o -name '.gitattributes' \
            -o -name '.nvmrc' -o -name '.babelrc' -o -name '.travis.yml' \
            -o -name 'tsconfig*.json' -o -name 'circle.yml' \
            -o -name 'gulpfile.js' -o -name 'gruntfile.js' -o -name 'Gruntfile.js' \
            -o -name '.yarnrc' -o -name '.yarnclean' -o -name 'jest.config.*' \
          \) -delete 2>/dev/null || true

      - name: Strip non-target prebuild binaries
        shell: bash
        env:
          PREBUILD_DIR: ${{ matrix.prebuild_dir }}
        run: |
          set -euo pipefail
          # Many native deps ship .node binaries for every platform inside
          # node_modules/<dep>/prebuilds/. Keep only the matching arch.
          find node_modules -type d -name 'prebuilds' | while read -r dir; do
            find "$dir" -mindepth 1 -maxdepth 1 -type d ! -name "$PREBUILD_DIR" \
              -exec rm -rf {} +
          done

      - name: Report node_modules size
        shell: bash
        run: du -sh node_modules

      - name: Stage archive layout
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.tag.outputs.version }}"
          platform="${{ matrix.platform }}"
          arch="${{ matrix.arch }}"
          name="navcoin-rescue-tool-${version}-${platform}-${arch}"
          echo "name=$name" >> "$GITHUB_OUTPUT"

          stage="staging/$name"
          rm -rf "$stage"
          mkdir -p "$stage/app/src" "$stage/runtime"

          cp -R src/* "$stage/app/src/"
          cp package.json "$stage/app/package.json"
          cp README.md "$stage/README.md"

          # Production node_modules
          cp -R node_modules "$stage/app/node_modules"

      - name: Stage Tauri GUI binary (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="staging/${{ steps.stage.outputs.name }}"
          # Tauri output dir is the workspace target dir
          if [ -f src-tauri/target/release/ntr-gui ]; then
            cp src-tauri/target/release/ntr-gui "$stage/ntr-gui"
            chmod +x "$stage/ntr-gui"
          else
            echo "ntr-gui binary not found" >&2
            ls -la src-tauri/target/release/ || true
            exit 1
          fi

      - name: Stage Tauri GUI binary (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="staging/${{ steps.stage.outputs.name }}"
          cp src-tauri/target/release/ntr-gui.exe "$stage/ntr-gui.exe"

      - name: Stage Node runtime (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="staging/${{ steps.stage.outputs.name }}"
          curl -fsSL "${{ matrix.node_url }}" -o node.tar
          mkdir -p node_extract
          if [[ "${{ matrix.node_url }}" == *.tar.xz ]]; then
            tar -xJf node.tar -C node_extract --strip-components=1
          else
            tar -xzf node.tar -C node_extract --strip-components=1
          fi
          mkdir -p "$stage/runtime/bin"
          cp node_extract/bin/node "$stage/runtime/bin/node"
          chmod +x "$stage/runtime/bin/node"

      - name: Stage Node runtime (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "staging/${{ steps.stage.outputs.name }}"
          Invoke-WebRequest -Uri "${{ matrix.node_url }}" -OutFile node.zip
          Expand-Archive -Path node.zip -DestinationPath node_extract
          $nodeDir = Get-ChildItem node_extract | Select-Object -First 1
          New-Item -ItemType Directory -Path "$stage/runtime" -Force | Out-Null
          Copy-Item "$($nodeDir.FullName)/node.exe" "$stage/runtime/node.exe"

      - name: Add CLI wrappers (unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="staging/${{ steps.stage.outputs.name }}"
          for name in ntr ntr-daemon; do
            script="src/${name#ntr-}.js"
            [ "$name" = "ntr" ] && script="src/cli.js"
            cat > "$stage/$name" <<EOF
          #!/bin/sh
          DIR=\$(cd "\$(dirname "\$0")" && pwd)
          exec "\$DIR/runtime/bin/node" "\$DIR/app/$script" "\$@"
          EOF
            chmod +x "$stage/$name"
          done

      - name: Add CLI wrappers (windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="staging/${{ steps.stage.outputs.name }}"
          # ntr.cmd
          cat > "$stage/ntr.cmd" <<'EOF'
          @echo off
          "%~dp0runtime\node.exe" "%~dp0app\src\cli.js" %*
          EOF
          # ntr-daemon.cmd
          cat > "$stage/ntr-daemon.cmd" <<'EOF'
          @echo off
          "%~dp0runtime\node.exe" "%~dp0app\src\daemon.js" %*
          EOF

      - name: Add macOS quarantine README
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          stage="staging/${{ steps.stage.outputs.name }}"
          name="${{ steps.stage.outputs.name }}"
          cat > "$stage/README-macOS.txt" <<EOF
          macOS Quarantine Notice
          =======================

          The binaries in this archive are not code-signed by Apple. macOS
          attaches a "com.apple.quarantine" extended attribute to anything
          downloaded from the internet and will refuse to run unsigned
          binaries until that attribute is stripped.

          Assuming you downloaded the archive into ~/Downloads and extracted
          it there (the macOS default), open Terminal and run:

            xattr -dr com.apple.quarantine ~/Downloads/$name

          Then double-click ntr-gui in Finder, or from Terminal run:

            cd ~/Downloads/$name
            ./ntr

          If you extracted the archive somewhere else, replace
          "~/Downloads/$name" with that path.
          EOF

      - name: Pack archive (tar.gz)
        if: matrix.ext == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.stage.outputs.name }}"
          tar -C staging -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Pack archive (zip - unix)
        if: matrix.ext == 'zip' && matrix.platform != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          name="${{ steps.stage.outputs.name }}"
          (cd staging && zip -r -q "../$name.zip" "$name")
          shasum -a 256 "$name.zip" > "$name.zip.sha256"

      - name: Pack archive (zip - windows)
        if: matrix.ext == 'zip' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "${{ steps.stage.outputs.name }}"
          Compress-Archive -Path "staging/$name" -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            ${{ steps.stage.outputs.name }}.${{ matrix.ext }}
            ${{ steps.stage.outputs.name }}.${{ matrix.ext }}.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sha256' \) -exec mv {} release-files/ \;
          ls -la release-files

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: ${{ steps.tag.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-files/*
