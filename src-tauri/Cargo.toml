[workspace]
members = ["daemon-launch"]

[package]
name = "ntr-gui"
version = "0.1.2"
description = "Tauri GUI for navcoin-rescue-tool"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ntr_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ntr-daemon-launch = { path = "daemon-launch" }
